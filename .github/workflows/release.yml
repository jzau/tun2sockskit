name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in release.json after validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tun2sockskit-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned native core
        run: python3 scripts/build-xcframework.py
      - name: Check release guards
        run: python3 scripts/test-release.py
      - name: Check every platform and native lifecycle
        run: python3 scripts/validate-build.py
      - name: Prepare package from the exact archive
        run: |
          python3 scripts/prepare-release.py
          cp Package.swift dist/Package.swift
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/HevSocks5Tunnel.xcframework.zip
            dist/BUILD_INFO.json
            dist/Package.swift
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Publish the validated archive and matching manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: python3 scripts/publish-release.py
